name: Organization Service CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: resolve_organization
          MYSQL_USER: resolve_user
          MYSQL_PASSWORD: resolve_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      PORT: 3000
      SERVICE_NAME: organization-service-ci
      DATABASE_URL: mysql://resolve_user:resolve_password@127.0.0.1:3307/resolve_organization
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-jwt-secret-that-is-at-least-32-characters
      JWT_ISSUER: resolve-authentication
      INTERNAL_AUTH_SECRET: ci-internal-secret-at-least-32-characters
      INTERNAL_ALLOWED_SERVICES: authentication-service,user-service
      SYSTEM_ADMIN_USER_IDS: system-admin
      RUN_DB_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
