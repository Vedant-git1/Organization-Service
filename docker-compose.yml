services:
  mysql:
    image: mysql:8.4
    container_name: resolve-organization-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: resolve_organization
      MYSQL_USER: resolve_user
      MYSQL_PASSWORD: resolve_password
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot_password']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: resolve-organization-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resolve-organization-app
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVICE_NAME: organization-service
      DATABASE_URL: mysql://resolve_user:resolve_password@mysql:3306/resolve_organization
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      JWT_SECRET: replace-with-at-least-32-character-development-secret
      JWT_ISSUER: resolve-authentication
      INTERNAL_AUTH_SECRET: replace-with-at-least-32-character-internal-secret
      INTERNAL_ALLOWED_SERVICES: authentication-service,user-service
      SYSTEM_ADMIN_USER_IDS: system-admin
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
